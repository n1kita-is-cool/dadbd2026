<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card</title>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Custom Sound Element -->
    <audio id="birthdaySound" src="song.mp3" preload="auto"></audio>

    <!-- Background Balloon & Photo Container -->
    <div class="balloon-container" id="balloonContainer"></div>

    <!-- Main Envelope -->
    <div class="wrapper" id="envelopeWrapper">
        <div class="envelope-back"></div>
        
        <div class="letter">
            <h2>Happy Birthday! 🎈</h2>
            <p>Sending you warm wishes on your special day.</p>
            <p>May this year bring you endless joy and success!</p>
        </div>

        <div class="envelope-front"></div>
        <div class="flap"></div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
