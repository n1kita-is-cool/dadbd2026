<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Card</title>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background-color: #fff3e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Floating Container for Balloons & Photos */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Standard Single Balloon */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp linear forwards;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -14px;
            left: 21px;
            width: 2px;
            height: 16px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        /* Photo Frame Floating with 2 Balloons on Strings */
        .photo-balloon-group {
            position: absolute;
            bottom: -400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatUp linear forwards;
        }

        /* The 2 Top Balloons */
        .balloon-pair {
            display: flex;
            gap: 40px;
            position: relative;
        }

        .attached-balloon {
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
        }

        /* Strings connecting Balloons to Photo */
        .attached-balloon::after {
            content: "";
            position: absolute;
            bottom: -60px;
            width: 1.5px;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.25);
        }

        .balloon-pair .attached-balloon:nth-child(1)::after {
            left: 22px;
            transform: rotate(-18deg);
            transform-origin: top;
        }

        .balloon-pair .attached-balloon:nth-child(2)::after {
            left: 22px;
            transform: rotate(18deg);
            transform-origin: top;
        }

        /* Larger Polaroid Photo Style */
        .floating-photo {
            margin-top: 55px;
            width: 160px;
            height: 190px;
            background-color: #ffffff;
            padding: 10px 10px 30px 10px;
            border-radius: 6px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
            box-sizing: border-box;
            transform: rotate(-3deg);
        }

        .floating-photo img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            border-radius: 3px;
        }

        /* Floating Keyframe Animation */
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.85;
            }
            100% {
                transform: translateY(-140vh) rotate(15deg);
                opacity: 0;
            }
        }

        /* Card Container */
        .wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            cursor: pointer;
            z-index: 2;
        }

        /* Envelope Back Layer */
        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #e65100;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 1;
            overflow: hidden;
        }

        /* Letter Card */
        .letter {
            position: absolute;
            bottom: 5px;
            left: 25px;
            width: 250px;
            height: 170px;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transform: translateY(0) scale(1);
        }

        .letter h2 {
            margin: 5px 0 10px 0;
            color: #e65100;
            font-size: 1.2rem;
        }

        .letter p {
            margin: 5px 0;
            color: #555;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Envelope Front Pocket Layer */
        .envelope-front {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #f57c00;
            border-right: 150px solid #f57c00;
            border-top: 100px solid transparent;
            border-bottom: 100px solid #f57c00;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 3;
            pointer-events: none;
        }

        /* Top Folding Flap */
        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #ff9800;
            transform-origin: top;
            transition: transform 0.5s ease-in-out, z-index 0.5s ease;
            z-index: 4;
        }

        /* OPEN STATE */
        .wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .wrapper.open .letter {
            animation: openLetter 1s 0.4s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* CLOSING STATE */
        .wrapper.closing .letter {
            animation: closeLetter 0.8s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        .wrapper.closing .flap {
            transition-delay: 0.6s;
            transform: rotateX(0deg);
            z-index: 4;
        }

        /* Keyframe Animations */
        @keyframes openLetter {
            0% {
                transform: translateY(0) scale(1);
                z-index: 2;
            }
            49% {
                z-index: 2;
            }
            50% {
                transform: translateY(-180px) scale(1);
                z-index: 5;
            }
            100% {
                transform: translateY(-50px) scale(1.15);
                z-index: 5;
            }
        }

        @keyframes closeLetter {
            0% {
                transform: translateY(-50px) scale(1.15);
                z-index: 5;
            }
            50% {
                transform: translateY(-180px) scale(1);
                z-index: 5;
            }
            51% {
                z-index: 2;
            }
            100% {
                transform: translateY(0) scale(1);
                z-index: 2;
            }
        }
    </style>
</head>
<body>

    <!-- Custom Sound Element -->
    <audio id="birthdaySound" src="song.mp3" preload="auto"></audio>

    <!-- Background Balloon & Photo Container -->
    <div class="balloon-container" id="balloonContainer"></div>

    <!-- Main Envelope -->
    <div class="wrapper" id="envelopeWrapper">
        <div class="envelope-back"></div>
        
        <div class="letter">
            <h2>Happy Birthday! 🎈</h2>
            <p>Sending you warm wishes on your special day.</p>
            <p>May this year bring you endless joy and success!</p>
        </div>

        <div class="envelope-front"></div>
        <div class="flap"></div>
    </div>

    <script>
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        const balloonContainer = document.getElementById('balloonContainer');
        const birthdaySound = document.getElementById('birthdaySound');

        const colors = ['#ff6f00', '#ff9800', '#ffa726', '#ffb74d', '#ff7043'];
        
        // Photos list with correct upper/lower case extensions
        const photoUrls = [
            'photos/photo1.JPG',
            'photos/photo2.JPG',
            'photos/photo3.jpg',
            'photos/photo4.jpg',
            'photos/photo5.jpg'
        ];

        // 1. Spawns a Single Random Balloon
        function spawnSingleBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.left = `${Math.random() * 92}%`;
            
            const duration = 7 + Math.random() * 5;
            balloon.style.animationDuration = `${duration}s`;

            balloonContainer.appendChild(balloon);

            // Remove from HTML once animation finishes
            setTimeout(() => balloon.remove(), duration * 1000);
        }

        // 2. Spawns a Single Random Floating Photo Group
        function spawnSinglePhoto() {
            const group = document.createElement('div');
            group.classList.add('photo-balloon-group');

            // Pick random colors and a random photo
            const color1 = colors[Math.floor(Math.random() * colors.length)];
            const color2 = colors[Math.floor(Math.random() * colors.length)];
            const randomPhoto = photoUrls[Math.floor(Math.random() * photoUrls.length)];

            group.innerHTML = `
                <div class="balloon-pair">
                    <div class="attached-balloon" style="background-color: ${color1}"></div>
                    <div class="attached-balloon" style="background-color: ${color2}"></div>
                </div>
                <div class="floating-photo">
                    <img src="${randomPhoto}" alt="Birthday photo memory">
                </div>
            `;

            // Random horizontal placement across full screen width (2% to 88%)
            // Uses calc() to ensure wider photo frames don't overflow off the right side
            const randomPercent = 2 + Math.random() * 86;
            group.style.left = `calc(${randomPercent}% - 20px)`;

            // Random floating duration between 10s and 14s
            const duration = 10 + Math.random() * 4;
            group.style.animationDuration = `${duration}s`;

            balloonContainer.appendChild(group);

            // Remove node after it floats past the screen
            setTimeout(() => group.remove(), duration * 1000);
        }

        // Continuous Spawners for Dynamic Randomness
        setInterval(spawnSingleBalloon, 1200); // New balloon every 1.2s
        setInterval(spawnSinglePhoto, 4500);   // New random photo every 4.5s

        // Spawn initial background items immediately
        for (let i = 0; i < 5; i++) spawnSingleBalloon();
        spawnSinglePhoto();

        // Confetti Launcher
        function launchConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff6f00', '#ff9800', '#ffa726', '#ffffff', '#ffd54f']
            });
        }

        // Open/Close Event Listener
        envelopeWrapper.addEventListener('click', () => {
            if (envelopeWrapper.classList.contains('open')) {
                envelopeWrapper.classList.remove('open');
                envelopeWrapper.classList.add('closing');
                
                birthdaySound.pause();
                birthdaySound.currentTime = 0;
            } else {
                envelopeWrapper.classList.remove('closing');
                envelopeWrapper.classList.add('open');
                
                setTimeout(() => {
                    birthdaySound.play().catch(error => {
                        console.log("Audio waiting for user interaction:", error);
                    });
                    launchConfetti();
                }, 600);
            }
        });
    </script>
</body>
</html>
